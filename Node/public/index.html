<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gironde API - Authentification</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Gironde API</h1>

        <div class="tabs">
            <button type="button" onclick="showForm('login')">
                Connexion
            </button>

            <button type="button" onclick="showForm('register')">
                Inscription
            </button>
        </div>

        <form id="loginForm">

            <h2>Connexion</h2>

            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Mot de passe"
                   autocomplete="current-password"
                   required>

            <button type="submit">
                Se connecter
            </button>

        </form>

        <form id="registerForm" hidden>

            <h2>Inscription</h2>

            <input type="text"
                   name="firstname"
                   placeholder="Prénom"
                   required>

            <input type="text"
                   name="lastname"
                   placeholder="Nom"
                   required>

            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Mot de passe"
                   autocomplete="new-password"
                   minlength="8"
                   required>

            <button type="submit">
                S'inscrire
            </button>

        </form>

        <p id="message" role="status"></p>

    </main>

    <script src="app.js"></script>

</body>

</html>
